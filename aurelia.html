<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aurelia — Fine Jewellery</title>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#120c09;--ink:#f1e9dc;--mut:#c9bba5;--gold:#d2b176;--line:rgba(241,233,220,.28);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:300 16px/1.7 Jost,'Helvetica Neue',Arial,sans-serif;overflow-x:hidden}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.nogl{background:var(--bg) center/cover fixed}
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:24px 4vw}
nav b{font:400 22px 'Bodoni Moda',Georgia,serif;letter-spacing:.04em}
nav a{color:var(--ink);text-decoration:none;font-size:14px;border-bottom:1px solid var(--line);padding-bottom:2px}
#film{position:relative;z-index:1;height:1700vh;pointer-events:none}
.fx{position:fixed;z-index:4;pointer-events:none;transition:opacity .5s}
#hero{left:4vw;bottom:9vh}
#hero h1{font:400 clamp(80px,16vw,250px)/.9 'Bodoni Moda',Georgia,serif;letter-spacing:-.045em;overflow:hidden;padding-bottom:.08em}
#hero h1 span{display:inline-block;transform:translateY(110%);transition:transform 1.8s cubic-bezier(.16,.8,.2,1)}
body.ready #hero h1 span{transform:none}
#hero p{margin-top:14px;font-size:18px;color:var(--ink)}
#cap{left:4vw;bottom:8vh;max-width:min(520px,80vw);opacity:0}
#cap.show{opacity:1}#cap.out .t,#cap.out .d{opacity:0;transform:translateY(10px)}
#cap .t,#cap .d{transition:opacity .35s,transform .35s}
#cap h2{font:400 clamp(40px,6vw,86px)/1 'Bodoni Moda',Georgia,serif;letter-spacing:-.02em}
#cap p{margin-top:14px;color:var(--mut);font-size:17px;padding-top:14px;border-top:1px solid var(--line)}
#cnt{right:4vw;bottom:8vh;text-align:right;font-size:14px;color:var(--mut);opacity:0}
#cnt.show{opacity:1}
#cnt i{display:block;width:120px;height:1px;background:var(--line);margin:10px 0 0 auto;position:relative}
#cnt i b{position:absolute;left:0;top:0;height:1px;background:var(--gold);width:0}
.end{position:relative;z-index:3;text-align:center;padding:30vh 6vw 12vh;background:linear-gradient(transparent,var(--bg) 28vh)}
.end h2{font:400 clamp(44px,8vw,120px)/1 'Bodoni Moda',Georgia,serif;letter-spacing:-.03em}
.end em{font-style:italic;color:var(--gold)}
.end p{max-width:40ch;margin:26px auto 0;color:var(--mut)}
.btn{display:inline-block;margin-top:44px;padding:18px 46px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-size:15px;letter-spacing:.06em;transition:background .5s,color .5s}
.btn:hover,.btn:focus-visible{background:var(--gold);color:var(--bg);outline:none}
footer{position:relative;z-index:3;background:var(--bg);display:flex;justify-content:space-between;padding:34px 4vw;border-top:1px solid rgba(241,233,220,.14);font-size:14px;color:var(--mut)}
#ld{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity 1.4s,visibility 0s 1.4s}
#ld b{font:400 38px 'Bodoni Moda',Georgia,serif;letter-spacing:.2em;animation:p 1.6s ease-in-out infinite}
@keyframes p{50%{opacity:.25}}
body.ready #ld{opacity:0;visibility:hidden}
@media(max-width:700px){#cnt{bottom:auto;top:84px}#cap{bottom:6vh}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}#hero h1 span{transform:none}}
</style></head><body>

<canvas id="gl"></canvas>
<nav><b>Aurelia</b><a href="#v">Book a viewing</a></nav>
<div id="hero" class="fx"><h1 aria-label="Aurelia"><span style="transition-delay:0s">A</span><span style="transition-delay:.07s">u</span><span style="transition-delay:.14s">r</span><span style="transition-delay:.21s">e</span><span style="transition-delay:.28s">l</span><span style="transition-delay:.35s">i</span><span style="transition-delay:.42s">a</span></h1><p>Fine jewellery. Scroll to look closer.</p></div>
<div id="cap" class="fx"><div class="t"><h2 id="ct"></h2></div><div class="d"><p id="cd"></p></div></div>
<div id="cnt" class="fx"><span id="cn">01 / 06</span><i><b id="cb"></b></i></div>
<div id="film"></div>
<section class="end" id="v"><h2>Visit us by <em>appointment</em></h2><p>Private viewings in our Paris salon, with time to try every piece.</p><a class="btn" href="#" onclick="return false">Book a viewing</a></section>
